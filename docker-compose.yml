# ─── SensorOps AI: Qdrant + FastAPI + Streamlit ───────────────────────────────
# Запуск:  docker compose up --build
#   API:   http://localhost:8000/docs
#   UI:    http://localhost:8501
#
# Полный стек эмбеддингов (torch CPU + sentence-transformers):
#   docker compose build --build-arg INSTALL_TRANSFORMERS=true
#
# Для реального LLM задайте в .env: LLM_BACKEND=litellm, LLM_MODEL, LLM_API_KEY.
# На сетях с медленным HuggingFace полезно HF_ENDPOINT=https://hf-mirror.com
# (модели faster-whisper скачиваются при первом вызове ASR).

services:
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: sensorops-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args:
        INSTALL_TRANSFORMERS: ${INSTALL_TRANSFORMERS:-false}
    container_name: sensorops-api
    environment:
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      LLM_BACKEND: ${LLM_BACKEND:-mock}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      HF_ENDPOINT: ${HF_ENDPOINT:-}
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  ui:
    build:
      context: .
      args:
        INSTALL_TRANSFORMERS: ${INSTALL_TRANSFORMERS:-false}
    container_name: sensorops-ui
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  qdrant_storage:
